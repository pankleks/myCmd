[package]
name = "mycmd"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
open = "5"
same-file = "1"
tempfile = "3"
notify = "8"
