[package]
name = "mycmd"
version = "0.2.12"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
url = "2"
ssh2 = "0.9.6"
tauri = { version = "2", features = [] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
open = "5"
same-file = "1"
filetime = "0.2"
imagesize = "0.15"
gif = { version = "0.14", default-features = false, features = ["std"] }
tempfile = "3"
notify = "8"
glob = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
